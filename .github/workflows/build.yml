name: NotiClear APK
on:
  push:
    branches: [noticlear]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk NotiClear.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: noticlear-v1.${{ github.run_number }}
          name: 알림지우개 v1.${{ github.run_number }}
          prerelease: true
          target_commitish: noticlear
          files: NotiClear.apk
